<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}

/* Layout: smalt enkeltspor (mobil først). Sticky top med navn og tabs, dagens program som blokke, samlet log nederst. Store tal i kondenseret skrift. */
:root{
  --bg:#eff1ec; --surface:#fafbf8; --ink:#141916; --mute:#5b665f; --line:#d8ddd4;
  --accent:#1c4fe0; --accent-ink:#ffffff; --accent-soft:#e1e8fd; --chip:#e6eae2;
  --good:#1b7f47; --warn:#9a6208; --bad:#b83225;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1311; --surface:#171c19; --ink:#e7ece6; --mute:#8d998f; --line:#28302b;
    --accent:#7da0ff; --accent-ink:#0b1220; --accent-soft:#1b2540; --chip:#212823;
    --good:#4cc47f; --warn:#e0a53a; --bad:#ef7a6c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1311; --surface:#171c19; --ink:#e7ece6; --mute:#8d998f; --line:#28302b;
  --accent:#7da0ff; --accent-ink:#0b1220; --accent-soft:#1b2540; --chip:#212823;
  --good:#4cc47f; --warn:#e0a53a; --bad:#ef7a6c; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:600;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 0}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who label{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.who select{width:auto;min-width:130px;max-width:56vw}
.tabs{display:flex;gap:0;margin-top:8px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:10px 12px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:18px 96px;display:flex;flex-direction:column;gap:16px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:120px;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em;min-width:0}
label.f input,label.f select{text-transform:none;letter-spacing:0;color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 160px;min-width:0}
.muted{color:var(--mute)}
.small{font-size:13px}

.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar input{width:auto}
.datebar .icon{width:40px;height:40px;padding:0;font-size:22px;line-height:1}
.dayname{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.05;text-transform:capitalize}
.wtitle{font-family:var(--display);font-weight:600;font-size:22px;color:var(--mute);margin-top:-6px}

.notice{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px}
.notice.warn{border-color:var(--warn)}
.notice h3{font-size:20px;margin-bottom:4px}
.notice p{margin:4px 0 0}
.hrsvg{width:100%;height:auto;display:block}
.zrow{display:grid;grid-template-columns:78px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.zbar{height:12px;background:var(--chip);border-radius:3px;overflow:hidden}
.zbar i{display:block;height:100%}
.zstat{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px}
.zstat b{font-size:22px;display:block;font-family:var(--disp,inherit)}
.stcard{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:14px 16px;margin:10px 0}
.stcard h3{font-size:18px;margin-bottom:2px}


.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bhead{padding:14px 16px 10px;display:flex;flex-direction:column;gap:2px}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.bhead h2{font-size:26px}
.fmt{font-weight:500}
.bnotes{padding:0 16px 10px;color:var(--mute)}
.alt{margin-top:4px}.alt summary{cursor:pointer;font-size:13px;color:var(--mute);padding:4px 0}
.edblk{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:10px}
.edit{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--accent-soft) 25%,var(--surface))}
.edtag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.item.head{padding-block:8px;background:var(--chip);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.irow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.irow>div{min-width:0}
.iname{font-weight:600;font-size:16px}
.scheme{color:var(--mute)}
.big{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.big small{font-size:16px;font-weight:600;margin-left:3px}
.you{display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right}
.you .lvl{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;color:var(--accent)}
.hint{font-size:13px;color:var(--mute)}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--ink)}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.acc{color:var(--accent)}
.log{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;align-items:end}
.log .wide{grid-column:span 2}
.log div.wide{grid-column:1/-1}
.lapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lapgrid .f{font-size:12px}
.saved{font-size:13px;color:var(--good);font-weight:600}
.blocklog{padding:12px 16px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface));display:flex;flex-direction:column;gap:10px}

.athcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.athcard h3{font-size:22px}
.athcard ul{margin:0;padding-left:18px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{font-size:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pick button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 10px;font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink)}
.pick button:hover{border-color:var(--accent)}

.prow{display:grid;grid-template-columns:minmax(120px,1.4fr) 1fr 1fr;gap:8px;align-items:end}
.prow .nm{font-weight:600;padding-bottom:9px}
.prow .nm small{display:block;font-weight:400;color:var(--mute);font-size:12px}
@media (max-width:520px){.prow{grid-template-columns:1fr 1fr}.prow .nm{grid-column:span 2;padding-bottom:0}}
.skillrow{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr 1fr;gap:8px;align-items:end}
@media (max-width:520px){.skillrow{grid-template-columns:1fr 1fr}.skillrow .nm{grid-column:span 2}}

.radarbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px 14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.radar{width:100%;max-width:440px;height:auto;display:block}
.radar .rg{fill:none;stroke:var(--line);stroke-width:1}
.radar .ra{fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.radar .rd{fill:var(--accent)}
.radar .rt{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:4 3;stroke-linejoin:round}
.legend{font-size:12px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend i.d{border-top:2px dashed var(--mute)}
.radar .rl{fill:var(--ink);font-family:var(--body);font-size:13px;font-weight:600}
.radar .rs{fill:var(--accent);font-family:var(--display);font-size:16px;font-weight:700}
.scores{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;margin:0;padding:0;list-style:none}
.scores li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
.scores b{font-family:var(--display);font-size:18px}
.wk{display:flex;flex-direction:column;gap:6px}
.wk h3{font-size:20px;color:var(--mute)}
.wrow{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--ink)}
.wrow:hover{border-color:var(--accent)}
.wrow .t{font-weight:600}
.wrow .d{font-size:13px;color:var(--mute);text-transform:capitalize}
.wrow.cur{border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
details summary{cursor:pointer;font-weight:600}
details p,details li{font-size:13px;color:var(--mute)}

</style>

<script>
(function(){
  var cfg=window.FIREBASE_CONFIG, coachEmail=String(window.COACH_EMAIL||'').toLowerCase();
  if(!cfg||!cfg.apiKey||/DIN_|INDSÆT|YOUR_/i.test(cfg.apiKey)){ window.SETUP_MISSING=true; window.claude={use:function(){return Promise.resolve(null);}}; return; }
  firebase.initializeApp(cfg);
  var auth=firebase.auth(), fs=firebase.firestore(), FV=firebase.firestore.FieldValue;
  var isCoach=false, readyRes, ok=false, ready=new Promise(function(r){readyRes=r;});
  function evalCoach(u){ return !!(u&&!u.isAnonymous&&u.email&&u.email.toLowerCase()===coachEmail); }
  auth.onAuthStateChanged(function(u){
    if(!u){ auth.signInAnonymously().catch(function(e){ window.AUTH_ERR=(e&&e.code?e.code:'')+(e&&e.message?' – '+e.message:''); readyRes(false); }); return; }
    var c=evalCoach(u), changed=(c!==isCoach); isCoach=c; ok=true; readyRes(true);
    if(changed&&window.coachAuth&&window.coachAuth.onChange) window.coachAuth.onChange(c);
  });
  window.coachAuth={
    onChange:null,
    signIn:function(e,p){ return auth.signInWithEmailAndPassword(e,p).then(function(cr){ if(!evalCoach(cr.user)){ return auth.signOut().then(function(){ throw new Error('not-coach'); }); } }); },
    signOut:function(){ return auth.signOut(); }
  };
  function snap(s){ return {id:s.id,exists:s.exists,data:function(){return s.data();},metadata:{}}; }
  function qsnap(s){ return {docs:s.docs.map(snap),size:s.size,empty:s.empty,docChanges:function(){return [];}}; }
  function flat(o,pre,out){
    Object.keys(o).forEach(function(k){
      var v=o[k], p=pre?pre+'.'+k:k;
      if(v&&typeof v==='object'&&!Array.isArray(v)){
        if(v.__delete__===true) out[p]=FV.delete(); else flat(v,p,out);
      } else out[p]=v;
    });
    return out;
  }
  function wrapDoc(r){
    return {id:r.id,path:r.path,
      get:function(){return r.get().then(snap);},
      set:function(d){return r.set(d);},
      update:function(d){return r.update(flat(d,'',{}));},
      delete:function(){return r.delete();},
      onSnapshot:function(n,e){return r.onSnapshot(function(s){n(snap(s));},e);}};
  }
  function wrapQuery(q){
    return {
      where:function(f,o,v){return wrapQuery(q.where(f,o==='eq'?'==':o,v));},
      orderBy:function(f,d){return wrapQuery(q.orderBy(f,d));},
      limit:function(n){return wrapQuery(q.limit(n));},
      get:function(){return q.get().then(qsnap);},
      onSnapshot:function(n,e){return q.onSnapshot(function(s){n(qsnap(s));},e);}
    };
  }
  var db={
    doc:function(p){return wrapDoc(fs.doc(p));},
    collection:function(p){
      var c=fs.collection(p), w=wrapQuery(c);
      w.doc=function(id){return wrapDoc(id?c.doc(id):c.doc());};
      w.add=function(d){return c.add(d).then(wrapDoc);};
      return w;
    }
  };
  var user={
    isOwner:function(){return ready.then(function(){return isCoach;});},
    canEdit:function(){return ready.then(function(){return isCoach;});},
    can:function(){return ready.then(function(){return true;});},
    id:function(){return ready.then(function(){return auth.currentUser?auth.currentUser.uid:null;});}
  };
  window.claude={use:function(name){
    if(name==='db') return ready.then(function(){return ok?db:null;});
    if(name==='user') return Promise.resolve(user);
    return Promise.resolve(null);
  }};
})();
</script>

/* ---------- Skalering og læring ---------- */
function workWeight(a,k){ var w=gw(a,k); if(w!=null) return w; var d=LOADS[k]; return d&&d.bar ? gpr(a,k) : null; }
function loadFor(ath,wo,it){
  var key=it.move, def=LOADS[key], pct=num(it.pct)||100;
  var w=workWeight(ath,key);
  var plan = wo&&wo.plan&&wo.plan[key]&&S.me ? wo.plan[key][S.me] : null;
  var load = w!=null ? Math.max(0,roundTo(w*pct/100,def.step)) : null;
  return {w:w,load:load,plan:plan==null?null:plan,pct:pct};
}
function nextW(def,w0,n,L,pct,comp,rpe){
  var r = rpe==null ? (comp==='full'?8:comp==='almost'?9.5:10) : rpe;
  if(comp==='almost') r=Math.max(r,9.5);
  if(comp==='fail') r=10;
  var base=L/(pct/100);
  var adj=Math.max(0.88,Math.min(1.12,1+0.03*(8-r)));
  var e=base*adj;
  if(comp==='fail') e*=0.95; else if(comp==='almost') e*=0.98;
  var a = n<=0?0.85 : n===1?0.6 : n===2?0.45 : 0.3;
  var nw = w0==null ? e : w0+a*(e-w0);
  return Math.max(0,roundTo(nw,def.step));
}
function gymScale(it,ath){
  var sk=SKILLS[it.skill], last=sk.ladder.length-1;
  var st=gsk(ath,it.skill), rx=Number.isInteger(it.level)?Math.max(0,Math.min(last,it.level)):null;
  var L=st&&Number.isInteger(st.level)?st.level:null;
  if(L==null) return {level:rx!=null?rx:0,kind:'unknown',hint:'Jeg kender ikke dit niveau endnu. Log passet, så lærer jeg det.',rx:rx};
  if(rx==null) rx=L;
  var use=Math.min(L,rx), kind=L<rx?'down':(L>rx?'above':'rx'), hint='';
  var reps=parseInt(it.reps,10)||0;
  if(use===L && st.max && reps){
    var cap=Math.max(1,Math.round(st.max*0.7));
    if(cap<reps) hint='Del op i sæt af højst '+cap+' (70 % af din max på '+st.max+').';
  }
  if((st.streak||0)>=((st.n||0)<3?1:2) && L<last && L<=rx){
    hint+=(hint?' ':'')+'Du har klaret de seneste pas let. Prøv '+sk.ladder[L+1]+' med få reps.';
  }
  return {level:use,kind:kind,hint:hint,rx:rx};
}
function nextSkill(st,used,comp,rpe,mx){
  st=st||{};
  var L=Number.isInteger(st.level)?st.level:null;
  var out={level:L,max:st.max!=null?st.max:null,streak:st.streak||0,fails:st.fails||0,n:(st.n||0)+1};
  var easy=comp==='full'&&rpe!=null&&rpe<=7, hard=comp==='fail'||(rpe!=null&&rpe>=9.5);
  if(L==null){ out.level=used; if(mx) out.max=mx; out.streak=easy?1:0; out.fails=0; return out; }
  if(used>L && comp==='full'){ out.level=used; out.streak=0; out.fails=0; out.max=mx||null; return out; }
  if(used===L){
    if(mx) out.max=mx;
    if(easy){ out.streak++; out.fails=0; }
    else if(comp==='fail'){ out.fails++; out.streak=0; if(out.fails>=2&&L>0){ out.level=L-1; out.fails=0; out.max=null; } }
    else if(hard){ out.streak=0; }
    else { out.fails=0; }
  }
  return out;
}

function lapParse(s){
  var out=[],bad=false; String(s||'').split(/[,;\s]+/).filter(Boolean).forEach(function(x){
    var m=/^(\d+):(\d{1,2})(?:[.,](\d))?$/.exec(x), sec;
    if(m) sec=parseInt(m[1],10)*60+parseInt(m[2],10)+(m[3]?parseInt(m[3],10)/10:0);
    else if(/^\d+([.,]\d)?$/.test(x)) sec=parseFloat(x.replace(',','.'));
    else { bad=true; return; }
    out.push(sec);
  });
  return {laps:out,bad:bad};
}
function roundsOf(w,bi,it){
  var b=w&&w.blocks&&w.blocks[bi]; if(!b) return 0;
  var m=/(\d+)\s*(?:runder|rounds?|rds|sæt)\b/i.exec((b.format||'')+' '+(b.title||'')+' '+(b.notes||'')); if(!m) m=/^(\d+)\s*x\b/i.exec(it&&it.label||'');
  var n=m?parseInt(m[1],10):0; return n>=2&&n<=30?n:0;
}
function lapFmt(s){ var m=Math.floor(s/60), r=Math.round((s-m*60)*10)/10; return m+':'+(r<10?'0':'')+String(r).replace('.',','); }
function lapSum(l){ l=(l||[]).filter(function(x){return x!=null;}); if(!l.length) return ''; var av=l.reduce(function(a,b){return a+b;},0)/l.length; return l.length+' runder, hurtigste '+lapFmt(Math.min.apply(null,l))+', snit '+lapFmt(av); }

  if(e.kind==='overall') return 'Samlet: '+(e.score||'–')+rpe+(e.note?' ('+e.note+')':'');
  return '';
}

/* ---------- Scoring (spindelvæv) ---------- */
function parseScore(s,metric){
  s=String(s==null?'':s).trim().toLowerCase().replace(',','.'); if(!s) return null;
  if(metric==='time'){
    var m=s.match(/^(?:(\d+):)?(\d+):(\d+(?:\.\d+)?)$/);
    if(m) return (parseInt(m[1]||'0',10)*60+parseInt(m[2],10))*60+parseFloat(m[3]);
    var n=s.match(/(\d+(?:\.\d+)?)/); return n?parseFloat(n[1])*60:null;
  }
  var rr=s.match(/^(\d+(?:\.\d+)?)\s*\+\s*(\d+(?:\.\d+)?)/);
  if(rr) return parseFloat(rr[1])*1000+parseFloat(rr[2]);
  var q=s.match(/(\d+(?:\.\d+)?)/); return q?parseFloat(q[1]):null;
}
/* Placering i holdet pr. kondi (1-10). Rx vægter tungest, skaleret tæller højst 70 %. */
function mcAll(){
  if(MC) return MC;
  var by={};
  Object.keys(S.results).forEach(function(k){
    var r=S.results[k]; if(!r||!r.items||!r.athleteId) return;
    var w=S.workouts[r.date]; if(!w||!Array.isArray(w.blocks)) return;
    Object.keys(r.items).forEach(function(ik){
      var e=r.items[ik];
      if(e&&e.kind==='machine'&&!e.alt&&(ik.indexOf('mx_')===0||ik.indexOf('it_')===0)){
        var bi2=parseInt(ik.split('_')[1],10), bb=w.blocks[bi2]; if(!bb||bb.type!=='metcon') return;
        var key2=r.date+'|'+ik; if(!by[key2]) by[key2]={date:r.date,mode:'cardio',low:false,machine:true,rows:[]};
        by[key2].rows.push({id:r.athleteId,cal:e.cal,m:e.m}); return;
      }
      if(!e||e.kind!=='metcon'||ik.indexOf('mc_')!==0) return;
      var b=w.blocks[parseInt(ik.slice(3),10)]; if(!b||b.type!=='metcon') return;
      var bi3=parseInt(ik.slice(3),10), via='score', lo=b.metric==='time', md=b.mode==='cardio'?'cardio':'mix';
      var v=parseScore(e.score,b.metric==='time'?'time':'reps');
      if(v==null&&e.laps&&e.laps.length){
        var nr=roundsOf(w,bi3,null);
        if(nr&&e.laps.length===nr&&e.laps.every(function(x){return x!=null;})){
          v=e.laps.reduce(function(s,x){return s+x;},0); via='laps'; lo=true;
          var its=(b.items||[]).filter(function(x){return x.type!=='other';});
          if(its.length&&its.every(function(x){return x.type==='machine';})) md='cardio';
        }
      }
      if(v==null) return;
      var key=r.date+'|'+ik; if(!by[key]) by[key]={date:r.date,mode:md,low:lo,via:via,rows:[]};
      if(by[key].via!==via) return;
      by[key].rows.push({id:r.athleteId,v:v,scaled:e.scale==='scaled'});
    });
  });
  var out={};
  Object.keys(by).forEach(function(k){
    var g=by[k];
    if(g.machine){
      var nc=g.rows.filter(function(x){return x.cal!=null;}).length, nm=g.rows.filter(function(x){return x.m!=null;}).length, un=nc>=nm?'cal':'m';
      g.rows=g.rows.filter(function(x){return x[un]!=null;}).map(function(x){return {id:x.id,v:x[un],scaled:false};});
    }
    var n=g.rows.length; if(n<2) return;
    if(g.rows.every(function(x){return x.v===g.rows[0].v;})) return;
    g.rows.forEach(function(x){
      var below=0, eq=0;
      g.rows.forEach(function(y){ if(y===x) return; if(y.v===x.v) eq++; else if(g.low?x.v<y.v:x.v>y.v) below++; });
      var pc=(below+0.5*eq)/(n-1); if(x.scaled) pc*=0.7;
      if(!out[x.id]) out[x.id]={};
      if(!out[x.id][g.mode]) out[x.id][g.mode]=[];
      out[x.id][g.mode].push({date:g.date,s:1+9*pc});
    });
  });
  MC=out; return out;
}
function mcAxis(id,mode){
  var l=(mcAll()[id]||{})[mode]; if(!l||!l.length) return null;
  l=l.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,8);
  return (l.reduce(function(s,x){return s+x.s;},0)+5)/(l.length+1);
}
function partScore(ath,t,key){
  if(t==='m') return ath&&ath.__id?mcAxis(ath.__id,key):null;
  if(t==='l'){
    var d=LOADS[key], v=Math.max(gpr(ath,key)||0,gw(ath,key)||0);
    if(gpr(ath,key)==null&&gw(ath,key)==null) return null;
    return Math.max(1,Math.min(10,1+9*Math.min(1,v/d.ref)));
  }
  var st=gsk(ath,key);
  if(t==='v'){ if(!st||!st.max) return null; return Math.max(1,Math.min(10,1+9*Math.min(1,st.max/VREF[key]))); }
  if(!st||!Number.isInteger(st.level)) return null;
  var last=SKILLS[key].ladder.length-1;
  return Math.max(1,Math.min(10,1+9*(st.level/last)));
}
function catScores(ath){
  return CATS.map(function(c){
    var vals=c.parts.map(function(p){return partScore(ath,p[0],p[1]);}).filter(function(x){return x!=null;});
    return {key:c.key,label:c.label,score:vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null,n:vals.length};
  });
}
function teamAvg(){
  var list=athleteList(), sums={}, cnt={};
  list.forEach(function(x){ catScores(x.a).forEach(function(c){ if(c.score!=null){ sums[c.key]=(sums[c.key]||0)+c.score; cnt[c.key]=(cnt[c.key]||0)+1; } }); });
  var o={}; Object.keys(sums).forEach(function(k){ if(cnt[k]>=2) o[k]=sums[k]/cnt[k]; }); return o;
}
function radarSvg(cats,avg){
  var cx=220,cy=170,R=105,n=cats.length;
  function pt(i,r){ var a=-Math.PI/2+i*2*Math.PI/n; return [cx+r*Math.cos(a),cy+r*Math.sin(a)]; }
  var s='<svg class="radar" viewBox="0 0 440 345" role="img" aria-label="Spindelvævsdiagram over styrker og svagheder">';
  if(avg && Object.keys(avg).length) s+='<polygon class="rt" points="'+cats.map(function(c,i){return pt(i,R*(avg[c.key]||0)/10).map(function(x){return x.toFixed(1);}).join(',');}).join(' ')+'"/>';
  [2,4,6,8,10].forEach(function(v){ s+='<polygon class="rg" points="'+cats.map(function(c,i){return pt(i,R*v/10).map(function(x){return x.toFixed(1);}).join(',');}).join(' ')+'"/>'; });
  cats.forEach(function(c,i){ var p=pt(i,R); s+='<line class="rg" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'; });
  s+='<polygon class="ra" points="'+cats.map(function(c,i){return pt(i,R*(c.score||0)/10).map(function(x){return x.toFixed(1);}).join(',');}).join(' ')+'"/>';
  cats.forEach(function(c,i){ if(c.score!=null){ var p=pt(i,R*c.score/10); s+='<circle class="rd" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5"/>'; } });
  cats.forEach(function(c,i){
    var a=-Math.PI/2+i*2*Math.PI/n, co=Math.cos(a), si=Math.sin(a), p=pt(i,R+20+(Math.abs(co)<0.7&&Math.abs(co)>0.15?10:0));
    var anchor=co>0.3?'start':(co<-0.3?'end':'middle'), y=p[1]+(si<-0.5?-12:(si>0.5?6:-4));
    s+='<text class="rl" x="'+p[0].toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+anchor+'">'+esc(c.label)+'</text>'
      +'<text class="rs" x="'+p[0].toFixed(1)+'" y="'+(y+16).toFixed(1)+'" text-anchor="'+anchor+'">'+(c.score!=null?nf(c.score):'–')+'</text>';
  });
  return s+'</svg>';
}

function blockHtml(b,w,ath){
  var h='<section class="block"><div class="bhead"><span class="tag">'+esc(TYPES[b.type]||'Andet')+'</span>'
    +'<h2>'+esc(b.title||TYPES[b.type]||'')+'</h2>'+(b.format?'<div class="fmt">'+esc(b.format)+'</div>':'')+'</div>';

function loadItem(it,w,ath){
  var def=LOADS[it.move]; if(!def) return '';
  var sc=loadFor(ath,w,it);
  var scheme=(it.reps!=null&&it.reps!==''?it.reps:'')+(sc.pct!==100?' · '+nf(sc.pct)+' % af din arbejdsvægt':'');
  var right = sc.load!=null ? '<div class="big">'+(it.move==='wpullup'?'+':'')+nf(sc.load)+'<small>'+esc(def.unit)+'</small></div>'
    : '<div class="hint" style="text-align:right">'+(ath?'Vælg selv en vægt.<br>Din første log sætter dit niveau.':'Vælg dit navn')+'</div>';
  var h='<div class="item"><div class="irow"><div><div class="iname">'+esc(it.label||def.name)+'</div><div class="scheme">'+esc(scheme)+'</div></div>'+right+'</div>';
  if(it.note) h+='<div class="hint">'+esc(it.note)+'</div>';
  if(ath){
    var bits=[];
    if(sc.plan!=null) bits.push('Plan i programmet: '+nf(sc.plan)+' '+def.unit+(sc.load!=null&&Math.abs(sc.plan-sc.load)>=def.step?' (din tilpassede vægt er '+nf(sc.load)+')':''));
    var last=lastMove(S.me,it.move,S.date);
    if(last) bits.push('Sidst '+shortLabel(last.date)+': '+nf(last.e.load)+' kg, '+(COMP[last.e.comp]||'').toLowerCase()+(last.e.rpe?', RPE '+nf(last.e.rpe):''));
    var pr=gpr(ath,it.move); if(pr!=null) bits.push('PR: '+nf(pr)+' kg');
    if(bits.length) h+='<div class="hint">'+esc(bits.join(' · '))+'</div>';
  }
  return h+'</div>';
}
function skillItem(it,ath){
  var sk=SKILLS[it.skill]; if(!sk) return '';

  var rxName=sc.rx!=null?sk.ladder[sc.rx]:null;
  var h='<div class="item"><div class="irow"><div><div class="iname">'+esc(it.label||sk.name)+'</div><div class="scheme">'
    +esc(it.reps!=null?String(it.reps):'')+(rxName?' · Rx: '+esc(rxName):'')+'</div></div>';

  if(ath&&sc.hint) h+='<div class="hint">'+esc(sc.hint)+'</div>';
  return h+'</div>';
}

/* Samlet log for dagens pas: én række pr. bevægelse */
function moveRows(w){
  var rows=[], seen={};
  (w.blocks||[]).forEach(function(b){ (b.items||[]).forEach(function(it){
    var id=null, type=null, key=null;
    if(it.type==='load'&&LOADS[it.move]){ type='load'; key=it.move; }
    else if(it.type==='skill'&&SKILLS[it.skill]){ type='skill'; key=it.skill; }
    if(!key) return;
    id=type+'_'+key;
    if(seen[id]){ seen[id].labels.push(it.label||''); return; }
    seen[id]={id:id,type:type,key:key,item:it,labels:[it.label||'']}; rows.push(seen[id]);
  }); });
  return rows;
}
function compSel(id,v){
  return '<select id="'+id+'">'+Object.keys(COMP_LONG).map(function(k){return '<option value="'+k+'"'+(v===k?' selected':'')+'>'+esc(COMP_LONG[k])+'</option>';}).join('')+'</select>';
}
function rpeSel(id,v){
  var o='<option value="">–</option>';
  for(var r=5;r<=10;r+=0.5){ o+='<option value="'+r+'"'+(String(v)===String(r)?' selected':'')+'>'+nf(r)+'</option>'; }
  return '<select id="'+id+'">'+o+'</select>';
}
/* ---------- Alternative øvelser ---------- */
var ALTS=null;
function altList(){
  if(ALTS) return ALTS;
  var a=[], seen={};
  function add(n,kind,key){ var l=n.toLowerCase(); if(seen[l]) return; seen[l]=1; a.push({name:n,kind:kind,key:key||null}); }
  Object.keys(MACH).forEach(function(k){ add(MACH[k],'machine',k); });
  add('Assault bike','machine','bike'); add('Cykel','machine','bikeerg'); add('Ro-ergometer','machine','row');
  Object.keys(LOADS).forEach(function(k){ add(LOADS[k].name,'load',k); });
  Object.keys(SKILLS).forEach(function(k){ add(SKILLS[k].name,'skill',k); });
  ['Burpees','Burpee over bar','Burpee box jumps','Single unders','Double unders','Air squats','Sit-ups','Push-ups','Box jumps','Step-ups (kropsvægt)','Lunges (kropsvægt)','Mountain climbers','Plank','Hollow hold','Jumping jacks','Shuttle runs'].forEach(function(n){ add(n,'free'); });
  ALTS=a; return a;
}
function altResolve(name){
  var l=String(name).trim().toLowerCase(), a=altList();
  for(var i=0;i<a.length;i++) if(a[i].name.toLowerCase()===l) return a[i];
  return {name:String(name).trim(),kind:'free',key:null};
}
function readAlt(id){
  var nm=dv(id+'an').trim(); if(!nm) return null;
  var r=altResolve(nm), a={name:r.name,kind:r.kind,key:r.key};

  else if(r.kind==='load'){ a.load=num(dv(id+'aw')); a.reps=dv(id+'ar').trim(); }
  else if(r.kind==='skill'){ var lv=parseInt(dv(id+'al'),10); if(isFinite(lv)&&SKILLS[r.key]){ a.level=lv; a.levelName=SKILLS[r.key].ladder[lv]; } a.reps=dv(id+'ar').trim(); }
  else { a.reps=dv(id+'ar').trim(); a.note=dv(id+'ax').trim(); }
  return a;
}

/* ---------- Log: én række pr. øvelse i hver blok ---------- */
function itemRows(w){
  var rows=[];
  (w.blocks||[]).forEach(function(b,bi){ (b.items||[]).forEach(function(it,ii){
    var ty=null;
    if(it.type==='load'&&LOADS[it.move]) ty='load'; else if(it.type==='skill'&&SKILLS[it.skill]) ty='skill';
    else if(it.type==='free') ty='free'; else if(it.type==='machine'&&MACH[it.machine]) ty='machine';

function savedFor(items,r){

function normProgram(obj){
  var warn=[];
  if(!obj||!Array.isArray(obj.blocks)) return {err:'Programmet skal have en liste "blocks".'};
  var blocks=obj.blocks.map(function(b,bi){
    var type=TYPES[b&&b.type]?b.type:'other';
    var items=(Array.isArray(b&&b.items)?b.items:[]).map(function(it,ii){
      if(it&&it.type==='load'&&LOADS[it.move]) return {type:'load',move:it.move,label:String(it.label||''),reps:it.reps==null?'':String(it.reps),pct:num(it.pct)||100,note:String(it.note||'')};
      if(it&&it.type==='skill'&&SKILLS[it.skill]){
        var lv=parseInt(it.level,10), last=SKILLS[it.skill].ladder.length-1;
        return {type:'skill',skill:it.skill,label:String(it.label||''),reps:it.reps==null?'':String(it.reps),level:isFinite(lv)?Math.max(0,Math.min(last,lv)):null,note:String(it.note||'')};
      }
      if(it&&it.type==='free') return {type:'free',label:String(it.label||''),reps:it.reps==null?'':String(it.reps),note:String(it.note||'')};
      if(it&&it.type==='machine'&&MACH[it.machine]) return {type:'machine',machine:it.machine,label:String(it.label||''),note:String(it.note||'')};
      if(it&&(it.type==='load'||it.type==='skill')){ warn.push('Blok '+(bi+1)+', punkt '+(ii+1)+': ukendt bevægelse ('+(it.move||it.skill)+'). Gemmes som tekst.'); return {type:'other',text:String(it.label||it.move||it.skill||'')}; }
      var o={type:'other',text:String((it&&it.text)||'')}; if(it&&it.head) o.head=true; return o;
    });
    var ob={title:String((b&&b.title)||''),type:type,format:String((b&&b.format)||''),notes:String((b&&b.notes)||''),items:items};
    if(type==='metcon'){ ob.metric=(b&&b.metric)==='time'?'time':'reps'; ob.mode=(b&&b.mode)==='cardio'?'cardio':'mix'; }
    return ob;
  });
  var prog={title:String(obj.title||''),note:String(obj.note||''),blocks:blocks};
  if(obj.week!=null&&isFinite(parseInt(obj.week,10))) prog.week=parseInt(obj.week,10);
  if(obj.block!=null&&isFinite(parseInt(obj.block,10))) prog.block=parseInt(obj.block,10);
  if(typeof obj.day==='string') prog.day=obj.day;
  if(typeof obj.draft==='boolean') prog.draft=obj.draft;
  if(obj.plan&&typeof obj.plan==='object') prog.plan=obj.plan;
  return {program:prog,warn:warn};
}

}
async function saveLog(){

    var key='it_'+r.bi+'_'+r.ii, base={label:it.label||'',block:r.block,ts:Date.now()}, e=null;

    } else if(r.type==='free'){

    }

    items[key]=e;
  });
  if(bad){ toast(bad,true); return; }
  /* Læring: én samlet opdatering pr. bevægelse, ud fra den sværeste variant eller tungeste vægt */

    g.c.forEach(function(c){ if(g.type==='load'?c.imp>best.imp:c.level>best.level) best=c; });
    if(g.type==='load'){
      var def=LOADS[rk], L=best.L, pct=best.pct, comp=best.comp, rpe=best.rpe;
      var ent={kind:'load',move:rk,name:def.name,unit:def.unit,load:L,comp:comp,rpe:rpe,pct:pct,derived:true,ts:Date.now()};
      items['mv_'+rk]=ent;

  });
  if(bad){ toast(bad,true); return; }
  var os=dv('lg-o-score').trim(), orpe=num(dv('lg-o-rpe')), on=dv('lg-o-note').trim();

  if(!Object.keys(items).length){ toast('Udfyld mindst én vægt eller et resultat.',true); return; }
  try{
    await writeResult(S.date,S.me,{items:items});
    var p=prune(patch);
    if(Object.keys(p).length) await enqueue(function(){ return S.db.doc('athletes/'+S.me).update(clean(p)); });
    S.fields={};

  }catch(e){ toast(errMsg(e),true); }

function detectItem(l){
  var low=l.toLowerCase(), rm=l.match(/^(\d+(?:\s*[-–]\s*\d+)?)\s+/), reps=rm?rm[1].replace(/\s+/g,''):'';
  for(var i=0;i<DETECT.length;i++){
    var d=DETECT[i];
    if(d[2].test(low)&&(!d[3]||d[3].test(low))){
      if(d[0]==='load'&&LOADS[d[1]]) return {type:'load',move:d[1],label:l,reps:reps,pct:100,note:''};
      if(d[0]==='skill'&&SKILLS[d[1]]){
        var lv=null;
        if(d[1]==='hspu'){ if(/deficit/.test(low)) lv=/kipping/.test(low)?4:5; else if(/strict/.test(low)) lv=3; else if(/chest|c2w|ctw/.test(low)) lv=2; else if(/abmat/.test(low)) lv=1; }
        return {type:'skill',skill:d[1],label:l,reps:reps,level:lv,note:''};
      }
    }
  }
  return {type:'free',label:l,reps:reps,note:''};
}
function parseKondiText(txt){
  var items=[];
  String(txt).split(/\r?\n/).forEach(function(l){
    l=l.trim(); if(!l) return;
    var m=l.match(/^@(\w+)\s*(.*)$/), k=m?m[1].toLowerCase():'';
    if(m&&MACH[k]) items.push({type:'machine',machine:k,label:m[2]||MACH[k],note:''});
    else if(l.charAt(0)==='#') items.push({type:'other',text:l.replace(/^#+\s*/,''),head:true});
    else if(l.charAt(0)==='~') items.push({type:'other',text:l.replace(/^~\s*/,'')});
    else if(/^(rest|hvile|pause|\d+\s*(min|sek|s)\b.*(rest|hvile|pause))/i.test(l)) items.push({type:'other',text:l});
    else items.push(detectItem(l));
  });
  return items;
}

function hspuFixBlocks(blocks){
  var ch=false;
  (blocks||[]).forEach(function(b){ (b.items||[]).forEach(function(it){
    if(it&&it.type==='skill'&&it.skill==='hspu'&&Number.isInteger(it.level)&&it.level>=4){ it.level++; ch=true; }
  }); });
  return ch;
}
function dotted(up){
  var o={};
  Object.keys(up).forEach(function(k){ var u=up[k];
    if(u.level!==undefined){ o['items.'+k+'.level']=u.level; o['items.'+k+'.levelName']=u.levelName; }
    if(u.alt){ o['items.'+k+'.alt.level']=u.alt.level; o['items.'+k+'.alt.levelName']=u.alt.levelName; }
  });
  return o;
}
function hspuFixItems(items){
  var upd={};
  Object.keys(items||{}).forEach(function(k){
    var e=items[k], u=null; if(!e) return;
    if(e.kind==='skill'&&e.skill==='hspu'&&Number.isInteger(e.level)&&e.level>=4){ u={level:e.level+1,levelName:SKILLS.hspu.ladder[e.level+1]}; }
    if(e.alt&&e.alt.kind==='skill'&&e.alt.key==='hspu'&&Number.isInteger(e.alt.level)&&e.alt.level>=4){ u=u||{}; u.alt={level:e.alt.level+1,levelName:SKILLS.hspu.ladder[e.alt.level+1]}; }
    if(u) upd[k]=u;
  });
  return upd;
}

function stRedirect(){ return location.origin+location.pathname; }
function stConnect(){
  var c=stCfg(); if(!c||!S.me) return;
  location.href='https://www.strava.com/oauth/authorize?client_id='+encodeURIComponent(c.clientId)+'&redirect_uri='+encodeURIComponent(stRedirect())
    +'&response_type=code&approval_prompt=auto&scope=activity:read_all&state='+encodeURIComponent('tlstrava:'+S.me);
}
async function stWorker(path,opt){
  var c=stCfg(), r=await fetch(c.worker.replace(/\/$/,'')+path,opt||{});
  var j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ var e=new Error((j&&(j.message||j.error))||('Strava-fejl '+r.status)); e.status=r.status; throw e; }
  return j;
}
function stPost(path,body){ return stWorker(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
async function stHandleReturn(){
  var q=new URLSearchParams(location.search), st=q.get('state')||'';
  if(st.indexOf('tlstrava:')!==0) return;
  var id=st.slice(9), code=q.get('code'), scope=q.get('scope')||'';
  history.replaceState(null,'',location.pathname);
  if(!stCfg()) return;
  if(q.get('error')||!code){ toast('Strava-forbindelsen blev afbrudt.',true); return; }
  try{
    var j=await stPost('/token',{code:code});
    var o={at:j.access_token,rt:j.refresh_token,exp:j.expires_at,sid:j.athlete&&j.athlete.id};
    S.me=id; lsSet('tl-me',id); lsSet('tl-strava-'+id,JSON.stringify(o));
    toast(/activity:read/.test(scope)?'Strava er forbundet.':'Strava er forbundet, men uden adgang til aktiviteter. Forbind igen og lad hakkerne stå.',!/activity:read/.test(scope));
    stSync();
  }catch(e){ toast('Kunne ikke forbinde Strava: '+e.message,true); }
}
async function stToken(){
  var o=stLoad(); if(!o) throw new Error('Ikke forbundet til Strava.');
  if(o.exp-60>Date.now()/1000) return o.at;
  var j=await stPost('/refresh',{refresh_token:o.rt});
  o.at=j.access_token; o.rt=j.refresh_token||o.rt; o.exp=j.expires_at; stSave(o);
  return o.at;
}
async function stApi(path){
  var tk=await stToken();
  return stWorker(path,{headers:{Authorization:'Bearer '+tk}});
}
function stLinked(){
  var m={}; Object.keys(S.results).forEach(function(k){ var r=S.results[k]; if(r&&r.hr&&r.hr.sid) m[r.hr.sid]=1; }); return m;
}
async function stSync(){
  if(!stCfg()||!S.me||!stLoad()||S.st.busy) return;
  S.st.busy=true; S.st.err=''; schedule();
  try{
    var after=Math.floor(Date.now()/1000)-120*86400;
    var list=await stApi('/api/activities?per_page=100&after='+after);
    S.st.acts=(list||[]).filter(function(a){ return a.has_heartrate; });
    S.st.at=Date.now();
  }catch(e){
    S.st.err=e.status===401?'Strava-forbindelsen er udløbet. Forbind igen under Profil.':e.message;
    if(e.status===401) stSave(null);
  }
  S.st.busy=false; schedule();
}
function stAuto(){
  if(S.st.auto||!S.me||!S.loaded.r||!stCfg()||!stLoad()) return;
  S.st.auto=true; stSync();
}
function stPending(){
  var linked=stLinked(), sk=stSkips();
  var lim=new Date(Date.now()-14*86400000).toISOString().slice(0,10);
  return (S.st.acts||[]).filter(function(a){ return !linked[a.id]&&sk.indexOf(a.id)<0&&a.start_date_local.slice(0,10)>=lim; })
    .sort(function(a,b){ return b.start_date_local<a.start_date_local?-1:1; });
}
function stDur(sec){ var m=Math.round(sec/60); return m>=60?Math.floor(m/60)+' t '+(m%60)+' min':m+' min'; }
function stCandidates(date){
  var ds=visibleDates(), t0=parseDate(date).getTime();
  return ds.map(function(d){ return {d:d,diff:Math.abs(parseDate(d).getTime()-t0)}; })
    .filter(function(x){ return x.diff<=21*86400000; })
    .sort(function(a,b){ return a.diff-b.diff; }).map(function(x){ return x.d; });
}
function stravaPrompt(){
  if(!stCfg()||!S.me||!stLoad()) return '';
  if(S.st.err) return '<div class="notice warn"><p>'+esc(S.st.err)+'</p></div>';
  var p=stPending(); if(!p.length) return '';
  var a=p[(S.st.pi||0)%p.length], date=a.start_date_local.slice(0,10), cands=stCandidates(date);
  var h='<div class="stcard"><h3>Ny aktivitet fra Strava</h3><p class="small"><b>'+esc(a.name)+'</b> · '+esc(shortLabel(date))+' kl. '+esc(a.start_date_local.slice(11,16))
    +' · '+esc(stDur(a.elapsed_time))+(a.average_heartrate?' · gns. puls '+Math.round(a.average_heartrate):'')+(a.max_heartrate?' · maks '+Math.round(a.max_heartrate):'')+'</p>';
  if(cands.length){
    var sel=val('st-d',cands[0]);
    h+='<label class="f wide">Knyt til træning<select id="st-d">'+cands.map(function(d){
      var w=S.workouts[d]; return '<option value="'+esc(d)+'"'+(d===sel?' selected':'')+'>'+esc(shortLabel(d)+(w&&w.title?' · '+w.title:''))+'</option>'; }).join('')+'</select></label>'
      +'<div class="row"><button class="btn" data-act="st-link" data-id="'+a.id+'"'+(S.st.busy?' disabled':'')+'>Knyt og hent puls</button> <button class="btn ghost" data-act="st-skip" data-id="'+a.id+'">Ignorér</button></div>';
  } else h+='<p class="small muted">Der er intet program omkring den dag at knytte til.</p><div class="row"><button class="btn ghost" data-act="st-skip" data-id="'+a.id+'">Ignorér</button></div>';
  if(p.length>1) h+='<p class="hint">Plus '+(p.length-1)+' flere aktiviteter, der venter. <button class="btn ghost sm" data-act="st-next">Vis næste</button></p>';
  return h+'</div>';
}
async function stLink(id){
  var a=(S.st.acts||[]).filter(function(x){ return String(x.id)===String(id); })[0]; if(!a) return;
  var cands=stCandidates(a.start_date_local.slice(0,10)), date=val('st-d',cands[0]); if(!date){ toast('Vælg en træning.',true); return; }
  S.st.busy=true; render();
  try{
    var s=await stApi('/api/streams?id='+a.id), hr=s&&s.heartrate&&s.heartrate.data, tm=s&&s.time&&s.time.data;
    if(!hr||!hr.length||!tm||tm.length!==hr.length) throw new Error('Aktiviteten har ingen pulsdata.');
    var dur=tm[tm.length-1], step=Math.max(5,Math.ceil(dur/360)), pts=[], j=0;
    for(var tt=0;tt<=dur;tt+=step){ while(j<tm.length-1&&tm[j+1]<=tt) j++; pts.push(hr[j]); }
    var avg=a.average_heartrate?Math.round(a.average_heartrate):Math.round(hr.reduce(function(x,y){return x+y;},0)/hr.length);
    var mx=a.max_heartrate?Math.round(a.max_heartrate):Math.max.apply(null,hr);
    await writeResult(date,S.me,{hr:{sid:a.id,name:a.name,start:a.start_date_local,dur:dur,step:step,avg:avg,max:mx,pts:pts}});
    S.fields={}; S.st.pi=0; S.date=date; S.dateTouched=true; S.st.busy=false; toast('Puls er knyttet til '+shortLabel(date).replace(/\.$/,'')+'.'); render();
  }catch(e){ S.st.busy=false; toast(e.message,true); render(); }
}
function stSkip(id){ var sk=stSkips(); sk.push(Number(id)); lsSet('tl-st-skip',JSON.stringify(sk)); render(); }
function maxHrOf(ath){
  if(ath&&ath.maxHr) return {v:ath.maxHr,est:false};
  var m=0; Object.keys(S.results).forEach(function(k){ var r=S.results[k]; if(r&&r.athleteId===ath.__id&&r.hr&&r.hr.max>m) m=r.hr.max; });
  if(ath.__id===S.me) (S.st.acts||[]).forEach(function(a){ if(a.max_heartrate>m) m=Math.round(a.max_heartrate); });
  return {v:Math.max(m,150),est:true};
}
function zoneSecs(hr,mx){
  var z=[0,0,0,0,0];
  (hr.pts||[]).forEach(function(b){ var i=0; for(var k=4;k>=0;k--) if(b>=ZONES[k].lo*mx){ i=k; break; } z[i]+=hr.step; });
  return z;
}
function hrChart(hr,mx){
  var W=340,H=170,L=34,R=8,T=8,B=22, pts=hr.pts, n=pts.length, tot=(n-1)*hr.step||1;
  var lo=Math.floor((Math.min.apply(null,pts)-5)/10)*10, hi=Math.ceil((Math.max(Math.max.apply(null,pts),ZONES[1].lo*mx)+5)/10)*10;
  var X=function(i){ return L+(W-L-R)*i*hr.step/tot; }, Y=function(b){ return T+(H-T-B)*(1-(b-lo)/(hi-lo)); };
  var s='<svg class="hrsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Puls igennem træningen">';
  ZONES.forEach(function(z,k){
    var a=z.lo*mx, b=k<4?ZONES[k+1].lo*mx:9999, y1=Y(Math.min(b,hi)), y2=Y(Math.max(a,lo));
    if(a<hi&&b>lo) s+='<rect x="'+L+'" y="'+y1.toFixed(1)+'" width="'+(W-L-R)+'" height="'+Math.max(0,y2-y1).toFixed(1)+'" fill="'+z.c+'" opacity=".2"/>';
  });
  for(var v=lo;v<=hi;v+=20) s+='<text x="'+(L-4)+'" y="'+(Y(v)+3).toFixed(1)+'" font-size="9" text-anchor="end" fill="currentColor" opacity=".6">'+v+'</text>';
  var step=tot>3600?15:tot>1800?10:5;
  for(var m=0;m*60<=tot;m+=step) s+='<text x="'+X(m*60/hr.step).toFixed(1)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" fill="currentColor" opacity=".6">'+m+' min</text>';
  s+='<path d="'+pts.map(function(b,i){ return (i?'L':'M')+X(i).toFixed(1)+' '+Y(b).toFixed(1); }).join('')+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  return s;
}
function hrCard(date,id){
  var r=resDoc(date,id), hr=r&&r.hr; if(!hr||!hr.pts||!hr.pts.length) return '';
  if(id!==S.me&&!S.canCoach&&!(window.STRAVA&&window.STRAVA.shareHr!==false)) return '';
  var ath=S.athletes[id]; if(!ath) return '';
  var m=maxHrOf(ath), z=zoneSecs(hr,m.v), tot=z.reduce(function(a,b){return a+b;},0)||1;
  var h='<section class="block"><div class="bhead"><span class="tag">Puls</span><h2>'+(id!==S.me?esc(ath.name)+' · ':'')+esc(hr.name||'Strava')+'</h2><div class="fmt muted">'+esc(stDur(hr.dur))+' · fra Strava</div></div>'
    +'<div class="zstat"><span class="small muted">Gennemsnit<b>'+hr.avg+'</b></span><span class="small muted">Maks<b>'+hr.max+'</b></span><span class="small muted">Maxpuls brugt<b>'+m.v+'</b></span></div>'
    +hrChart(hr,m.v)+'<div style="margin-top:10px">';
  ZONES.forEach(function(zz,k){
    h+='<div class="zrow"><span><b>'+zz.n+'</b><br><small class="muted">'+zz.d+'</small></span><span class="zbar"><i style="width:'+(z[k]/tot*100).toFixed(1)+'%;background:'+zz.c+'"></i></span><span>'+stDur(z[k]).replace(' min',' m')+' <small class="muted">'+Math.round(z[k]/tot*100)+'%</small></span></div>';
  });
  h+='</div><div class="hint">Zonerne er procent af maxpulsen ('+Math.round(ZONES[1].lo*100)+', 70, 80 og 90 %).'+(m.est?' Din maxpuls er endnu ikke sat, så jeg bruger den højeste puls, jeg har set. Sæt den under Profil for rigtige zoner.':'')+'</div></section>';
  return h;
}
function stProfile(){
  var a=myAth();
  var h='<section class="sec"><h2>Puls og Strava</h2><label class="f">Maxpuls (slag i minuttet)<input id="p-maxhr" inputmode="numeric" value="'+esc(val('p-maxhr',a&&a.maxHr!=null?a.maxHr:''))+'"></label>'
    +'<p class="hint">Bruges til pulszonerne. Kender du den ikke, så lad feltet stå tomt. Så bruger appen den højeste puls fra dine Strava-aktiviteter de seneste 4 måneder.</p>';
  if(!stCfg()) return h+'<p class="small muted">Strava er ikke sat op endnu. Coachen skal først udfylde filen strava-config.js.</p></section>';
  if(stLoad()){
    h+='<p class="small">Forbundet til Strava på denne enhed.</p><div class="row"><button class="btn ghost sm" data-act="st-sync"'+(S.st.busy?' disabled':'')+'>'+(S.st.busy?'Tjekker…':'Tjek Strava nu')+'</button> <button class="btn danger sm" data-act="st-disc">Afbryd</button> <button class="btn ghost sm" data-act="st-unskip">Vis ignorerede igen</button></div>'
      +(S.st.at?'<p class="hint">Sidst tjekket '+new Date(S.st.at).toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})+'. Nye aktiviteter fra de seneste 14 dage tilbydes. Din højeste puls de seneste 4 måneder bruges som maxpuls, hvis du ikke har sat den.</p>':'');
  } else h+='<p class="small muted">Forbind, så finder appen dine tracked træninger og kan knytte dem til dagens workout.</p><div class="row"><button class="btn" data-act="st-connect"'+(S.me?'':' disabled')+'>Forbind Strava</button></div>';
  return h+'</section>';
}

/* ---------- Start ---------- */
function ensureMe(){
  if(S.me && S.athletes[S.me]) return;
  var saved=lsGet('tl-me');
  S.me = (saved && S.athletes[saved]) ? saved : null;
}
function autoDate(){
  if(S.dateTouched||S.autoDone) return;
  S.autoDone=true;
  if(visible(S.workouts[S.date])) return;
  var nx=nextWorkoutDate();
  if(nx){ S.date=nx; return; }
  var ds=visibleDates(); if(ds.length) S.date=ds[ds.length-1];
}
async function init(){
  stHandleReturn();
  render();
  var C=window.claude;
  if(!C||!C.use){ S.noRuntime=true; render(); return; }
  try{ S.db=await C.use('db'); }catch(e){ S.db=null; }
  try{ S.user=await C.use('user'); }catch(e){ S.user=null; }
  try{ S.sample=await C.use('sample'); }catch(e){ S.sample=null; }
  if(S.user){ try{ S.canCoach=await S.user.canEdit(); S.canWrite=await S.user.can('data.write'); }catch(e){} }
  var me0=lsGet('tl-me'); if(me0) S.me=me0;
  if(!S.db){ render(); return; }
  var mkErr=function(w){ return function(e){ S.err='Kunne ikke hente data ('+(e&&e.code||'fejl')+') – '+w+'.'; schedule(); }; };
  S.db.collection('athletes').onSnapshot(function(snap){
    var o={}; snap.docs.forEach(function(d){ var v=d.data(); v.__id=d.id; o[d.id]=v; }); S.athletes=o; S.loaded.a=true; ensureMe(); maybeMigrate(); schedule();
  },mkErr('athletes'));
  var unsubW=null;
  function subWorkouts(){
    if(unsubW) unsubW();
    var q=S.db.collection('workouts');
    if(window.coachAuth && !S.canCoach) q=q.where('draft','==',false);
    unsubW=q.onSnapshot(function(snap){
      var o={}; snap.docs.forEach(function(d){ o[d.id]=d.data(); }); S.workouts=o; S.loaded.w=true; autoDate(); schedule();
    },mkErr('workouts, '+((window.coachAuth&&!S.canCoach)?'gæst':'coach')));
  }
  subWorkouts();
  if(window.coachAuth) window.coachAuth.onChange=function(isCoach){
    if(isCoach===S.canCoach) return;
    S.canCoach=isCoach; S.confirm=null; S.fields={};
    if(isCoach) maybeMigrate();
    if(!isCoach&&(S.tab==='coach')) S.tab='today';
    subWorkouts(); render();
  };
  S.db.collection('results').orderBy('date','desc').limit(400).onSnapshot(function(snap){
    var o={}; snap.docs.forEach(function(d){ o[d.id]=d.data(); }); S.results=o; S.loaded.r=true; stAuto(); schedule();
  },mkErr('results'));
  render();
}
init();
})();
</script>
